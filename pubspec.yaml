name: syncraft
description: >
  Offline-first Flutter package. Queues GET/POST/PUT/DELETE requests
  locally using sqflite and auto-syncs when internet returns.
  App never freezes. Data never lost. No manual retry needed.
version: 1.0.0
homepage: https://github.com/yourusername/syncraft

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.3.0
  connectivity_plus: ^6.0.0
  http: ^1.2.0
  uuid: ^4.3.3
  path: ^1.9.0
  crypto: ^3.0.3
  shared_preferences: ^2.2.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
