name: syncraft
description: Offline-first API request queue for Flutter with automatic background sync and retry support.
version: 1.0.1

homepage: https://github.com/Coderkube-App
repository: https://github.com/Coderkube-App/syncraft
issue_tracker: https://github.com/Coderkube-App/syncraft/issues

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: '>=3.10.0'

dependencies:
  flutter:
    sdk: flutter
  sqflite: ^2.4.2+1
  connectivity_plus: ^7.1.1
  http: ^1.6.0
  uuid: ^4.5.3
  path: ^1.9.1
  crypto: ^3.0.7
  shared_preferences: ^2.5.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0
